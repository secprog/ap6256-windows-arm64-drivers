name: Build ARM64 drivers

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version_state:
        description: Saved source-versions.json for version-state recovery
        required: false
        type: string

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: driver-versions-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.ref || 'builds' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache SDK and WDK packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ap6256-packages
          key: windows-arm64-wdk-sdk-${{ hashFiles('.github/scripts/packages.config') }}

      - name: Restore SDK and WDK packages
        run: |
          nuget restore .github/scripts/packages.config -PackagesDirectory "$env:RUNNER_TEMP/ap6256-packages" -Source https://api.nuget.org/v3/index.json -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'SDK/WDK package restore failed.' }

      - name: Restore source-version cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ap6256-versions
          key: source-versions-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-versions-v1-

      - name: Restore version-state backup
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RECOVERED_VERSION_STATE: ${{ inputs.version_state }}
        run: ./.github/scripts/restore-versions.ps1 -VersionCacheDirectory "$env:RUNNER_TEMP/ap6256-versions"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build and prepare artifacts
        id: drivers
        run: |
          ./.github/scripts/build-drivers.ps1 -OutputDirectory "$env:RUNNER_TEMP/ap6256-build" -ArtifactDirectory "$env:RUNNER_TEMP/ap6256-artifacts" -VersionCacheDirectory "$env:RUNNER_TEMP/ap6256-versions" -WdkPackageDirectory "$env:RUNNER_TEMP/ap6256-packages"

      - name: Analyze driver code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp/platform:arm64
          upload-database: false

      - name: Upload driver binaries and matching source
        uses: actions/upload-artifact@v7
        with:
          name: ap6256-arm64-${{ steps.drivers.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ap6256-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Upload version-state backup
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v7
        with:
          name: source-versions
          path: ${{ runner.temp }}/ap6256-versions/source-versions.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Save source-version cache
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ap6256-versions
          key: source-versions-v1-${{ github.run_id }}-${{ github.run_attempt }}

